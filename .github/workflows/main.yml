# Root CI: builds and validates every mod in the monorepo.
#
# A prior "discover" job scans mods/ and emits the matrix dynamically, so
# adding a new mod folder is all that's needed — no workflow edits required.

name: RimWorld Mods CI

env:
  FORCE_COLOR: 1

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    name: Discover mods
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Emit a JSON array of {mod, version} objects — one entry per subdirectory
      # of mods/. All mods target 1.6; extend here if per-mod versions are needed.
      - name: Scan mods/ directory
        id: scan
        run: |
          matrix=$(ls mods/ | jq -R '{"mod": ., "version": "1.6"}' | jq -sc '.')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: '${{ matrix.mod }} @ ${{ matrix.version }}'
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/callable-build-mod.yml
    with:
      mod: ${{ matrix.mod }}
      version: ${{ matrix.version }}
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
